<!doctype html><html lang="en"><head><title>Book online | KEVI Hair & Beauty</title><meta name="description" content="Book your hair, braiding or nail appointment at KEVI Hair & Beauty."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header id="site-header"></header><main><section class="wrap"><h1>Book online</h1><p>Pick your services, a time that suits you, and send the request on WhatsApp for confirmation.</p><div id="booking" class="form"><div class="card"><h2>1. Services</h2><div id="svc"></div><h2 style="margin-top:2rem">2. Stylist, date and time</h2><label class="f" for="stylist">Stylist</label><select id="stylist"></select><label class="f" for="date">Date</label><input type="date" id="date"><label class="f">Time</label><div class="slots" id="slots" role="group" aria-label="Available times"></div></div><div class="card"><h2>3. Your details</h2><label class="f" for="name">Name</label><input id="name" autocomplete="name"><label class="f" for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel"><label class="f" for="note">Note (optional)</label><textarea id="note" rows="2"></textarea><p id="sum" style="margin-top:1rem"></p><button class="btn" id="go" type="button">Request appointment</button><p id="err" role="alert"></p></div></div></section></main><footer id="site-footer"></footer><script src="data.js"></script><script src="main.js"></script></body></html>
